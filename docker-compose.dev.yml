# Local development only. Production uses docker-compose.yml together with
# docker-compose.production.yml and must never be started with this file.
name: workhive-dev

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file:
      - ./backend/.env
    environment:
      DATABASE_USE_NULL_POOL: "true"
      ENVIRONMENT: development
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
      TRUSTED_HOSTS: localhost,127.0.0.1,backend,testserver
      FORCE_HTTPS: "false"
      EMAIL_ENABLED: "false"
      CONTACT_FORM_ENABLED: "false"
      ACCOUNT_REQUEST_NOTIFICATIONS_ENABLED: "false"
      BILLING_ENABLED: "false"
      SUBSCRIPTION_ENFORCEMENT_ENABLED: "false"
      GOOGLE_CALENDAR_ENABLED: "false"
      VERIFACTU_ENABLED: "false"
      RUN_CALENDAR_BACKGROUND_SYNC: "false"
      TRIAL_EXPIRY_REMINDERS_ENABLED: "false"
      PAYMENT_REMINDERS_ENABLED: "false"
      FISCAL_CALENDAR_REMINDERS_ENABLED: "false"
      MEDIA_STORAGE_BACKEND: local
      MEDIA_STORAGE_PATH: /data/media
      INVOICE_PDF_STORAGE_PATH: /data/invoices
      ELECTRONIC_INVOICE_STORAGE_PATH: /data/electronic-invoices
      FISCAL_CERTIFICATE_STORAGE_PATH: /data/fiscal-certificates
      WATCHFILES_FORCE_POLLING: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8000:8000"
    working_dir: /workspace/backend
    volumes:
      - ./:/workspace:ro
      - backend_venv:/opt/venv
      - backend_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # Next updates its tracked next-env.d.ts declaration when it starts.
      - .:/workspace
      - frontend_node_modules:/workspace/frontend/node_modules
      - frontend_next:/workspace/frontend/.next
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/login').then(response=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  backend_venv:
  backend_data:
  frontend_node_modules:
  frontend_next:
