schemaVersion: '2.2'
description: Deploy an approved immutable WorkHive main revision or release from ECR.
parameters:
  ReleaseRef:
    type: String
    description: Existing WorkHive full Git SHA or semantic release tag.
    interpolationType: ENV_VAR
    allowedPattern: '^(v[0-9]+\.[0-9]+\.[0-9]+|[0-9a-f]{40})$'
mainSteps:
  - action: aws:runShellScript
    name: deployReviewedRelease
    precondition:
      StringEquals:
        - platformType
        - Linux
    inputs:
      timeoutSeconds: '900'
      runCommand:
        - |
          set -eu
          release_ref="${SSM_ReleaseRef:?ReleaseRef is required}"
          exec /bin/bash /home/ubuntu/workhive/ops/deploy/deploy_ecr_release.sh "$release_ref"
