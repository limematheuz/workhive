name: Security

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy:
    name: Secrets & misconfig (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Scan repo for secrets and misconfigurations
        # Pin commit SHA (not a floating tag) after trivy-action supply-chain incident.
        # https://github.com/aquasecurity/trivy-action/releases/tag/v0.36.0
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: CRITICAL,HIGH
          skip-dirs: node_modules,.git,venv,.venv,__pycache__,.pytest_cache,frontend/.next,backend/storage
          exit-code: "1"
          format: table

  backend-security:
    name: Python SAST & dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: pip install -r requirements-dev.txt

      - name: Bandit (Python security lint)
        run: bandit -r app -c pyproject.toml -ll

      - name: pip-audit (dependency CVEs)
        run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-1325
