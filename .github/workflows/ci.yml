name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: workhive_ci
          POSTGRES_PASSWORD: workhive_ci_password
          POSTGRES_DB: workhive_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workhive_ci -d workhive_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: sqlite:///./ci.db
      MIGRATION_DATABASE_URL: postgresql://workhive_ci:workhive_ci_password@localhost:5432/workhive_ci
      MIGRATION_TEST_DATABASE_URL: postgresql://workhive_ci:workhive_ci_password@localhost:5432/workhive_ci
      SECRET_KEY: github-actions-test-secret-key-not-for-production
      ENVIRONMENT: test
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
      TRUSTED_HOSTS: localhost,127.0.0.1,testserver
      FORCE_HTTPS: "false"

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Test backup automation
        run: bash ../ops/backup/test_backup_to_s3.sh

      - name: Test ECR deployment automation
        run: bash ../ops/deploy/test_deploy_ecr_release.sh

      - name: Validate ECR production Compose contract
        working-directory: .
        env:
          POSTGRES_PASSWORD: compose-test-password
          SECRET_KEY: compose-test-secret
          APP_DOMAIN: example.test
          BACKEND_IMAGE: registry.example/workhive/backend:v1.1.1
          FRONTEND_IMAGE: registry.example/workhive/frontend:v1.1.1
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.production.yml \
            config --format json \
            | jq -e '
                .services.backend.build == null
                and .services.frontend.build == null
                and .services.backend.image == env.BACKEND_IMAGE
                and .services.frontend.image == env.FRONTEND_IMAGE
              '

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: pip install -r requirements-dev.txt

      - name: Apply and verify PostgreSQL migrations
        run: alembic upgrade head

      - name: Run backend tests
        run: pytest -q

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        run: pnpm test

      - name: Check TypeScript
        run: pnpm typecheck

      - name: Run lint
        run: pnpm lint

      - name: Build production frontend
        run: pnpm build
