name: Deploy main to production

on:
  push:
    branches:
      - main

permissions:
  contents: read
  checks: read
  id-token: write

# Keep production single-flight. Do not cancel a running deployment: SSM may
# already be changing the production instance.
concurrency:
  group: workhive-production-deploy
  cancel-in-progress: false

jobs:
  verify-main-checks:
    name: Require successful main checks
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Wait for CI and security checks for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          required_checks=(
            "Backend tests"
            "Frontend checks"
            "Secrets & misconfig (Trivy)"
            "Python SAST & dependencies"
            "react-doctor"
          )

          for attempt in $(seq 1 121); do
            checks_json="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/commits/${COMMIT_SHA}/check-runs?per_page=100")"
            pending=false

            for check_name in "${required_checks[@]}"; do
              check="$(jq -c --arg name "$check_name" \
                '[.check_runs[] | select(.name == $name)]
                 | sort_by(.started_at // .completed_at // "")
                 | last // {}' <<< "$checks_json")"
              status="$(jq -r '.status // "missing"' <<< "$check")"
              conclusion="$(jq -r '.conclusion // ""' <<< "$check")"

              if [[ "$status" == "completed" && "$conclusion" == "success" ]]; then
                printf 'Passed: %s\n' "$check_name"
              elif [[ "$status" == "completed" ]]; then
                printf 'Required check %s ended with %s for %s.\n' \
                  "$check_name" "${conclusion:-no conclusion}" "$COMMIT_SHA" >&2
                exit 1
              else
                printf 'Waiting for %s (%s).\n' "$check_name" "$status"
                pending=true
              fi
            done

            if [[ "$pending" == "false" ]]; then
              exit 0
            fi

            sleep 15
          done

          printf 'Timed out waiting for required checks for %s.\n' "$COMMIT_SHA" >&2
          exit 1

  build-and-publish:
    name: Build and publish main images
    needs: verify-main-checks
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Download exact main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Confirm checked-out commit
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Read application version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          test -n "$version"
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Request temporary AWS publishing credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: workhive-main-images-${{ github.run_id }}
          role-duration-seconds: 2700
          mask-aws-account-id: true

      - name: Sign in to private ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6
        with:
          mask-password: true

      - name: Check immutable image tags
        id: tags
        env:
          BACKEND_REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY }}
          FRONTEND_REPOSITORY: ${{ vars.ECR_FRONTEND_REPOSITORY }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          existing=0
          for repository in "$BACKEND_REPOSITORY" "$FRONTEND_REPOSITORY"; do
            image_count="$(aws ecr batch-get-image \
              --repository-name "$repository" \
              --image-ids "imageTag=${COMMIT_SHA}" \
              --query 'length(images)' \
              --output text)"
            test "$image_count" = "0" || test "$image_count" = "1"
            existing=$((existing + image_count))
          done

          case "$existing" in
            0) printf 'already_published=false\n' >> "$GITHUB_OUTPUT" ;;
            2) printf 'already_published=true\n' >> "$GITHUB_OUTPUT" ;;
            *)
              printf 'Refusing mixed backend/frontend image state for %s.\n' "$COMMIT_SHA" >&2
              exit 1
              ;;
          esac

      - name: Prepare Docker Buildx
        if: steps.tags.outputs.already_published == 'false'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and publish backend
        if: steps.tags.outputs.already_published == 'false'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_BACKEND_REPOSITORY }}:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
            GIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=workhive-backend
          cache-to: type=gha,mode=max,scope=workhive-backend
          provenance: false
          sbom: false

      - name: Build and publish frontend
        if: steps.tags.outputs.already_published == 'false'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_FRONTEND_REPOSITORY }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SUPPORT_EMAIL=${{ vars.NEXT_PUBLIC_SUPPORT_EMAIL }}
            NEXT_PUBLIC_SUPPORT_PHONE=${{ vars.NEXT_PUBLIC_SUPPORT_PHONE }}
            NEXT_PUBLIC_BUSINESS_LOCATION=${{ vars.NEXT_PUBLIC_BUSINESS_LOCATION }}
            NEXT_PUBLIC_APP_VERSION=${{ steps.version.outputs.value }}
            NEXT_PUBLIC_GIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=workhive-frontend
          cache-to: type=gha,mode=max,scope=workhive-frontend
          provenance: false
          sbom: false

      - name: Verify published immutable image tags
        env:
          BACKEND_REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY }}
          FRONTEND_REPOSITORY: ${{ vars.ECR_FRONTEND_REPOSITORY }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for repository in "$BACKEND_REPOSITORY" "$FRONTEND_REPOSITORY"; do
            image_count="$(aws ecr batch-get-image \
              --repository-name "$repository" \
              --image-ids "imageTag=${COMMIT_SHA}" \
              --query 'length(images)' \
              --output text)"
            test "$image_count" = "1"
          done

  deploy:
    name: Deploy approved main revision
    needs: build-and-publish
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production

    steps:
      - name: Request temporary AWS deployment credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: workhive-main-deploy-${{ github.run_id }}
          role-duration-seconds: 1800
          mask-aws-account-id: true

      - name: Request approved production deployment
        id: deploy
        env:
          INSTANCE_ID: ${{ vars.PRODUCTION_EC2_INSTANCE_ID }}
          RELEASE_REF: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          command_id="$(aws ssm send-command \
            --document-name WorkHiveProductionDeploy \
            --instance-ids "$INSTANCE_ID" \
            --parameters "ReleaseRef=${RELEASE_REF}" \
            --timeout-seconds 900 \
            --comment "WorkHive approved main revision ${RELEASE_REF}" \
            --query 'Command.CommandId' \
            --output text)"
          test -n "$command_id"
          printf 'command_id=%s\n' "$command_id" >> "$GITHUB_OUTPUT"

      - name: Wait for verified deployment result
        env:
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
          INSTANCE_ID: ${{ vars.PRODUCTION_EC2_INSTANCE_ID }}
          RELEASE_REF: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 61); do
            if ! status="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>&1)"; then
              if [[ "$status" == *"InvocationDoesNotExist"* ]]; then
                sleep 15
                continue
              fi
              printf 'Unable to read the SSM deployment result; inspect SSM Command history.\n' >&2
              exit 1
            fi
            case "$status" in
              Success)
                printf 'Production deployment of %s succeeded.\n' "$RELEASE_REF"
                exit 0
                ;;
              Pending|InProgress|Delayed|"") sleep 15 ;;
              *)
                printf 'Production deployment ended with SSM status: %s\n' "$status" >&2
                exit 1
                ;;
            esac
          done
          printf 'Timed out waiting for the production deployment result.\n' >&2
          exit 1
