name: Publish release images to ECR

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Annotated release tag to publish, for example v1.1.0
        required: true
        type: string

permissions:
  contents: read
  checks: read

concurrency:
  group: publish-release-images-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  release-metadata:
    name: Validate release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      version: ${{ steps.release.outputs.version }}
      git_sha: ${{ steps.release.outputs.git_sha }}

    steps:
      - name: Download repository history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate annotated release tag
        id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            printf 'Release publication must be dispatched from main.\n' >&2
            exit 1
          fi

          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf 'release_tag must use vMAJOR.MINOR.PATCH.\n' >&2
            exit 1
          fi

          git fetch --force origin \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}" \
            "refs/heads/main:refs/remotes/origin/main"

          if [[ "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" != "tag" ]]; then
            printf 'release_tag must be an annotated Git tag.\n' >&2
            exit 1
          fi

          git_sha="$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")"
          if ! git merge-base --is-ancestor "$git_sha" refs/remotes/origin/main; then
            printf 'The release commit must already belong to main.\n' >&2
            exit 1
          fi

          version="$(git show "${git_sha}:VERSION" | tr -d '[:space:]')"
          if [[ "v${version}" != "$RELEASE_TAG" ]]; then
            printf 'VERSION does not match release_tag.\n' >&2
            exit 1
          fi

          {
            printf 'release_tag=%s\n' "$RELEASE_TAG"
            printf 'version=%s\n' "$version"
            printf 'git_sha=%s\n' "$git_sha"
          } >> "$GITHUB_OUTPUT"

  verified-checks:
    name: Require successful release checks
    needs: release-metadata
    runs-on: ubuntu-latest
    # CI can legitimately take longer than the original ~4-minute polling
    # window. Leave enough room for a complete release gate without making
    # publication wait indefinitely.
    timeout-minutes: 10

    steps:
      - name: Verify required checks on the release commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.release-metadata.outputs.git_sha }}
        shell: bash
        run: |
          set -euo pipefail

          required_checks=(
            "Backend tests"
            "Frontend checks"
            "Secrets & misconfig (Trivy)"
            "Python SAST & dependencies"
            "react-doctor"
          )

          for attempt in $(seq 1 33); do
            checks_json="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/commits/${RELEASE_SHA}/check-runs?per_page=100")"
            pending=0

            for check_name in "${required_checks[@]}"; do
              conclusion="$(jq -r --arg name "$check_name" \
                '[.check_runs[] | select(.name == $name)]
                 | sort_by(.completed_at)
                 | last
                 | .conclusion // "missing"' <<< "$checks_json")"

              case "$conclusion" in
                success) ;;
                queued|in_progress|missing)
                  printf 'Waiting for required check %s (%s), attempt %s/33.\n' \
                    "$check_name" "$conclusion" "$attempt"
                  pending=1
                  ;;
                *)
                  printf 'Required check %s is %s for %s.\n' \
                    "$check_name" "$conclusion" "$RELEASE_SHA" >&2
                  exit 1
                  ;;
              esac
            done

            if [[ "$pending" -eq 0 ]]; then
              printf 'All required CI and security checks passed for the release commit.\n'
              exit 0
            fi

            sleep 15
          done

          printf 'Timed out waiting for required checks for %s.\n' "$RELEASE_SHA" >&2
          exit 1

  publish:
    name: Build and publish immutable images
    needs:
      - release-metadata
      - verified-checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download exact release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.release-metadata.outputs.git_sha }}
          fetch-depth: 1

      - name: Confirm checked-out release
        env:
          EXPECTED_SHA: ${{ needs.release-metadata.outputs.git_sha }}
          EXPECTED_VERSION: ${{ needs.release-metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(tr -d '[:space:]' < VERSION)" = "$EXPECTED_VERSION"

      - name: Request temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: workhive-release-${{ github.run_id }}
          role-duration-seconds: 2700
          mask-aws-account-id: true

      - name: Sign in to private ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6
        with:
          mask-password: true

      - name: Reject existing immutable tags
        env:
          BACKEND_REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY }}
          FRONTEND_REPOSITORY: ${{ vars.ECR_FRONTEND_REPOSITORY }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.release-metadata.outputs.git_sha }}
        shell: bash
        run: |
          set -euo pipefail

          for repository in "$BACKEND_REPOSITORY" "$FRONTEND_REPOSITORY"; do
            for image_tag in "$RELEASE_SHA" "$RELEASE_TAG"; do
              image_count="$(aws ecr batch-get-image \
                --repository-name "$repository" \
                --image-ids "imageTag=${image_tag}" \
                --query 'length(images)' \
                --output text)"

              if [[ "$image_count" != "0" ]]; then
                printf 'Refusing to overwrite existing immutable tag %s in %s.\n' \
                  "$image_tag" "$repository" >&2
                exit 1
              fi
            done
          done

      - name: Prepare Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and publish backend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_BACKEND_REPOSITORY }}:${{ needs.release-metadata.outputs.git_sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_BACKEND_REPOSITORY }}:${{ needs.release-metadata.outputs.release_tag }}
          build-args: |
            APP_VERSION=${{ needs.release-metadata.outputs.version }}
            GIT_SHA=${{ needs.release-metadata.outputs.git_sha }}
          labels: |
            org.opencontainers.image.version=${{ needs.release-metadata.outputs.version }}
            org.opencontainers.image.revision=${{ needs.release-metadata.outputs.git_sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=workhive-backend
          cache-to: type=gha,mode=max,scope=workhive-backend
          # ECR Basic scans single image manifests, not OCI indexes containing
          # Buildx attestations. CI keeps the SAST, dependency, and Trivy gates.
          provenance: false
          sbom: false

      - name: Build and publish frontend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_FRONTEND_REPOSITORY }}:${{ needs.release-metadata.outputs.git_sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_FRONTEND_REPOSITORY }}:${{ needs.release-metadata.outputs.release_tag }}
          build-args: |
            NEXT_PUBLIC_SUPPORT_EMAIL=${{ vars.NEXT_PUBLIC_SUPPORT_EMAIL }}
            NEXT_PUBLIC_SUPPORT_PHONE=${{ vars.NEXT_PUBLIC_SUPPORT_PHONE }}
            NEXT_PUBLIC_BUSINESS_LOCATION=${{ vars.NEXT_PUBLIC_BUSINESS_LOCATION }}
            NEXT_PUBLIC_APP_VERSION=${{ needs.release-metadata.outputs.version }}
            NEXT_PUBLIC_GIT_SHA=${{ needs.release-metadata.outputs.git_sha }}
          labels: |
            org.opencontainers.image.version=${{ needs.release-metadata.outputs.version }}
            org.opencontainers.image.revision=${{ needs.release-metadata.outputs.git_sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=workhive-frontend
          cache-to: type=gha,mode=max,scope=workhive-frontend
          # Keep the frontend artifact compatible with ECR Basic scanning too.
          provenance: false
          sbom: false

      - name: Verify published tags
        env:
          BACKEND_REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY }}
          FRONTEND_REPOSITORY: ${{ vars.ECR_FRONTEND_REPOSITORY }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.release-metadata.outputs.git_sha }}
        shell: bash
        run: |
          set -euo pipefail

          for repository in "$BACKEND_REPOSITORY" "$FRONTEND_REPOSITORY"; do
            for image_tag in "$RELEASE_SHA" "$RELEASE_TAG"; do
              image_count="$(aws ecr batch-get-image \
                --repository-name "$repository" \
                --image-ids "imageTag=${image_tag}" \
                --query 'length(images)' \
                --output text)"
              test "$image_count" = "1"
            done
          done

          {
            printf '### WorkHive release images published\n\n'
            printf -- '- Version: `%s`\n' "$RELEASE_TAG"
            printf -- '- Revision: `%s`\n' "$RELEASE_SHA"
            printf -- '- Images: backend and frontend\n'
          } >> "$GITHUB_STEP_SUMMARY"
