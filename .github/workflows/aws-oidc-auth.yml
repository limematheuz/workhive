name: AWS OIDC authentication test

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-oidc-auth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authenticate:
    name: Verify temporary AWS credentials
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Request temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: workhive-oidc-${{ github.run_id }}
          role-duration-seconds: 900
          mask-aws-account-id: true

      - name: Verify temporary identity
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity >/dev/null
          printf 'GitHub OIDC authentication succeeded.\n'
